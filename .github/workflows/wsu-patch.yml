name: Apply Syscall Hooks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-syscall-hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 0

      - name: Download original patch
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/White-Society/kernel-patches/refs/heads/whitesu/syscall_hook/syscall_hooks_4.14.patch" \
            -o syscall_hooks.patch

      - name: Validate remaining patch
        run: |
          git apply \
            --check \
            --whitespace=fix \
            --exclude=drivers/input/input.c \
            --exclude=fs/exec.c \
            syscall_hooks.patch

      - name: Apply remaining patch
        run: |
          git apply \
            --whitespace=fix \
            --exclude=drivers/input/input.c \
            --exclude=fs/exec.c \
            syscall_hooks.patch

      - name: Adapt Samsung input.c
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("drivers/input/input.c")
          data = path.read_text()

          def replace_once(old, new, label):
              global data
              count = data.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 occurrence, found {count}"
                  )
              data = data.replace(old, new, 1)

          declaration = """#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          #endif

          """

          signature = """void input_event(struct input_dev *dev,
                   unsigned int type, unsigned int code, int value)
          {"""

          replace_once(
              signature,
              declaration + signature,
              "input_event declaration"
          )

          old = """\tint idx = 0;

          \tif (is_event_supported(type, dev->evbit, EV_MAX)) {"""

          new = """\tint idx = 0;

          #if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          \tif (unlikely(ksu_input_hook))
          \t\tksu_handle_input_handle_event(&type, &code, &value);
          #endif

          \tif (is_event_supported(type, dev->evbit, EV_MAX)) {"""

          replace_once(old, new, "input_event hook")

          path.write_text(data)
          print("Samsung input.c adapted successfully")
          PY

      - name: Adapt Samsung exec.c
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("fs/exec.c")
          data = path.read_text()

          def replace_once(old, new, label):
              global data
              count = data.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected 1 occurrence, found {count}"
                  )
              data = data.replace(old, new, 1)

          declaration = """#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          __attribute__((hot))
          extern int ksu_handle_execve_sucompat(int *fd, const char __user **filename_user,
          \t\t\t\t       void *__never_use_argv, void *__never_use_envp,
          \t\t\t\t       int *__never_use_flags);
          #endif

          """

          native = """SYSCALL_DEFINE3(execve,
          \t\tconst char __user *, filename,
          \t\tconst char __user *const __user *, argv,
          \t\tconst char __user *const __user *, envp)
          {"""

          replace_once(
              native,
              declaration + native,
              "Native execve declaration"
          )

          native_hook = """SYSCALL_DEFINE3(execve,
          \t\tconst char __user *, filename,
          \t\tconst char __user *const __user *, argv,
          \t\tconst char __user *const __user *, envp)
          {
          #if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          \tksu_handle_execve_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);
          #endif"""

          native_original = """SYSCALL_DEFINE3(execve,
          \t\tconst char __user *, filename,
          \t\tconst char __user *const __user *, argv,
          \t\tconst char __user *const __user *, envp)
          {"""

          replace_once(
              native_original,
              native_hook,
              "Native execve hook"
          )

          compat = """COMPAT_SYSCALL_DEFINE3(execve, const char __user *, filename,
          \tconst compat_uptr_t __user *, argv,
          \tconst compat_uptr_t __user *, envp)
          {"""

          compat_hook = """COMPAT_SYSCALL_DEFINE3(execve, const char __user *, filename,
          \tconst compat_uptr_t __user *, argv,
          \tconst compat_uptr_t __user *, envp)
          {
          #if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          \tksu_handle_execve_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);
          #endif"""

          replace_once(
              compat,
              compat_hook,
              "Compat execve hook"
          )

          path.write_text(data)
          print("Samsung exec.c adapted successfully")
          PY

      - name: Verify syscall hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              "drivers/input/input.c": "ksu_handle_input_handle_event",
              "fs/exec.c": "ksu_handle_execve_sucompat",
              "fs/open.c": "ksu_handle_faccessat",
              "fs/read_write.c": "ksu_handle_sys_read",
              "fs/stat.c": "ksu_handle_stat",
              "kernel/reboot.c": "ksu_handle_sys_reboot",
              "kernel/sys.c": "ksu_handle_setresuid",
          }

          for filename, symbol in checks.items():
              path = Path(filename)

              if not path.exists():
                  raise SystemExit(f"Missing file: {filename}")

              content = path.read_text()

              if symbol not in content:
                  raise SystemExit(
                      f"Missing syscall hook: {symbol} in {filename}"
                  )

              print(f"OK: {filename} -> {symbol}")

          exec_content = Path("fs/exec.c").read_text()

          if exec_content.count("ksu_handle_execve_sucompat") != 3:
              raise SystemExit(
                  "execve hook declaration/native/compat verification failed"
              )

          print("All syscall hook checks passed!")
          PY

      - name: Check whitespace
        run: |
          git diff --check

      - name: Show changes
        run: |
          git diff --stat
          git status --short

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "ERROR: No changes were applied!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add \
            drivers/input/input.c \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c \
            kernel/reboot.c \
            kernel/sys.c

          git commit -m "Integrate KernelSU syscall hooks"

      - name: Push changes
        run: |
          git push origin HEAD:refs/heads/lineage-24.0
