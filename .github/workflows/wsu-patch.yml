name: Apply KernelSU Syscall Hooks

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-syscall-hooks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: lineage-24.0
          fetch-depth: 0

      - name: Download syscall hooks patch
        run: |
          curl -fL \
            "https://raw.githubusercontent.com/White-Society/kernel-patches/refs/heads/whitesu/syscall_hook/syscall_hooks_4.14.patch" \
            -o syscall_hooks.patch

      - name: Check patch
        run: |
          git apply --check \
            --whitespace=fix \
            --exclude=drivers/input/input.c \
            --exclude=fs/exec.c \
            syscall_hooks.patch

      - name: Apply patch
        run: |
          git apply \
            --whitespace=fix \
            --exclude=drivers/input/input.c \
            --exclude=fs/exec.c \
            syscall_hooks.patch

      - name: Adapt drivers/input/input.c
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("drivers/input/input.c")
          data = path.read_text()

          if "ksu_handle_input_handle_event" in data:
              raise SystemExit("input.c already contains KSU hook")

          declaration = """#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          extern bool ksu_input_hook __read_mostly;
          extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);
          #endif

          """

          pattern = (
              r'(?m)^void input_event\(struct input_dev \*dev,\n'
              r'\s+unsigned int type, unsigned int code, int value\)\n'
              r'\{\n'
          )

          replacement = declaration + """void input_event(struct input_dev *dev,
          		 unsigned int type, unsigned int code, int value)
          {
          #if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          	if (unlikely(ksu_input_hook))
          		ksu_handle_input_handle_event(&type, &code, &value);
          #endif

          """

          data, count = re.subn(pattern, replacement, data)

          if count != 1:
              raise SystemExit(
                  f"input_event: expected 1 insertion point, found {count}"
              )

          path.write_text(data)
          print("Successfully integrated input_event hook")
          PY

      - name: Adapt fs/exec.c
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path("fs/exec.c")
          data = path.read_text()

          if "ksu_handle_execve_sucompat" in data:
              raise SystemExit("exec.c already contains KSU hook")

          declaration = """#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          __attribute__((hot))
          extern int ksu_handle_execve_sucompat(int *fd, const char __user **filename_user,
          			       void *__never_use_argv, void *__never_use_envp,
          			       int *__never_use_flags);
          #endif

          """

          native_pattern = (
              r'(?m)^SYSCALL_DEFINE3\(execve,\n'
              r'\s*const char __user \*, filename,\n'
              r'\s*const char __user \*const __user \*, argv,\n'
              r'\s*const char __user \*const __user \*, envp\)\n'
              r'\{\n'
          )

          native_replacement = declaration + """SYSCALL_DEFINE3(execve,
          		const char __user *, filename,
          		const char __user *const __user *, argv,
          		const char __user *const __user *, envp)
          {
          #if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          	ksu_handle_execve_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);
          #endif
          """

          data, count = re.subn(
              native_pattern,
              native_replacement,
              data
          )

          if count != 1:
              raise SystemExit(
                  f"Native execve: expected 1 insertion point, found {count}"
              )

          compat_pattern = (
              r'(?m)^COMPAT_SYSCALL_DEFINE3\(execve, const char __user \*, filename,\n'
              r'\s*const compat_uptr_t __user \*, argv,\n'
              r'\s*const compat_uptr_t __user \*, envp\)\n'
              r'\{\n'
          )

          compat_replacement = """COMPAT_SYSCALL_DEFINE3(execve, const char __user *, filename,
          	const compat_uptr_t __user *, argv,
          	const compat_uptr_t __user *, envp)
          {
          #if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)
          	ksu_handle_execve_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);
          #endif
          """

          data, count = re.subn(
              compat_pattern,
              compat_replacement,
              data
          )

          if count != 1:
              raise SystemExit(
                  f"Compat execve: expected 1 insertion point, found {count}"
              )

          path.write_text(data)
          print("Successfully integrated native and compat execve hooks")
          PY

      - name: Verify all syscall hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          checks = {
              "drivers/input/input.c": "ksu_handle_input_handle_event",
              "fs/exec.c": "ksu_handle_execve_sucompat",
              "fs/open.c": "ksu_handle_faccessat",
              "fs/read_write.c": "ksu_handle_sys_read",
              "fs/stat.c": "ksu_handle_stat",
              "kernel/reboot.c": "ksu_handle_sys_reboot",
              "kernel/sys.c": "ksu_handle_setresuid",
          }

          for filename, symbol in checks.items():
              path = Path(filename)

              if not path.is_file():
                  raise SystemExit(f"Missing file: {filename}")

              content = path.read_text()

              if symbol not in content:
                  raise SystemExit(
                      f"Missing hook: {symbol} in {filename}"
                  )

              print(f"OK: {filename}: {symbol}")

          exec_data = Path("fs/exec.c").read_text()

          if exec_data.count("ksu_handle_execve_sucompat") != 3:
              raise SystemExit(
                  "execve hook verification failed: "
                  "expected declaration, native and compat calls"
              )

          input_data = Path("drivers/input/input.c").read_text()

          if input_data.count("ksu_handle_input_handle_event") != 2:
              raise SystemExit("input_event hook verification failed")

          print("All seven syscall hook files verified!")
          PY

      - name: Verify whitespace
        run: |
          git diff --check

      - name: Show changes
        run: |
          git diff --stat
          git status --short

          if [[ -z "$(git status --porcelain)" ]]; then
            echo "ERROR: No changes detected!"
            exit 1
          fi

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit changes
        run: |
          git add \
            drivers/input/input.c \
            fs/exec.c \
            fs/open.c \
            fs/read_write.c \
            fs/stat.c \
            kernel/reboot.c \
            kernel/sys.c

          git commit -m "Integrate KernelSU syscall hooks"

      - name: Push changes
        run: |
          git push origin HEAD:refs/heads/lineage-24.0
