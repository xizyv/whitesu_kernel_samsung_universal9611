name: Build WKP kernel (Galaxy A51)

on:
  workflow_dispatch:
    inputs:
      ksu:
        description: "Add WhiteSU (off = clean kernel, for bootloop testing)"
        type: boolean
        default: true

env:
  DEFCONFIG: exynos9611-a51_defconfig
  LOCALVERSION: "-WKP-AOSP"
  AK3_DIR: AnyKernel3
  SETUP_URL: https://raw.githubusercontent.com/White-Society/WhiteSU/dev/kernel/setup.sh
  SETUP_ARG: legacy
  PATCH_FILE: patches/syscall_hook_4.14.patch
  TOOLCHAIN_REPO: https://github.com/kdrag0n/proton-clang
  MAKE_FLAGS: >-
    -j4 O=out ARCH=arm64 CC=clang
    CROSS_COMPILE=aarch64-linux-gnu-
    CROSS_COMPILE_ARM32=arm-linux-gnueabi-
    CLANG_TRIPLE=aarch64-linux-gnu-
    LD=ld.lld AR=llvm-ar NM=llvm-nm
    OBJCOPY=llvm-objcopy OBJDUMP=llvm-objdump STRIP=llvm-strip
    KCFLAGS=-Wno-error

jobs:
  build:
    runs-on: ubuntu-22.04
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout kernel (this repo)
        uses: actions/checkout@v4
        with:
          path: kernel

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev libelf-dev \
            zip cpio lz4 git curl device-tree-compiler python3 python-is-python3

      - name: Clone toolchain (clang)
        run: |
          git clone --depth=1 "$TOOLCHAIN_REPO" toolchain
          echo "$GITHUB_WORKSPACE/toolchain/bin" >> "$GITHUB_PATH"

      - name: Add WhiteSU to kernel tree
        if: ${{ inputs.ksu }}
        working-directory: kernel
        run: curl -LSs "$SETUP_URL" | bash -s "$SETUP_ARG"

      - name: Apply syscall hooks patch
        if: ${{ inputs.ksu }}
        working-directory: kernel
        run: |
          # 1) apply what applies cleanly; 2 hunks are expected to be rejected
          patch -p1 --no-backup-if-mismatch -N < "$PATCH_FILE" || true
          find . -name '*.rej' -print -delete

          # 2) insert the 2 rejected hunks by anchoring on function names
          python3 - <<'PY'
          import re

          GUARD = "#if defined(CONFIG_KSU) && !defined(CONFIG_KSU_KPROBES_HOOK)\n"

          # --- drivers/input/input.c ---
          p = "drivers/input/input.c"
          s = open(p, encoding="utf-8", errors="surrogateescape").read()
          if "ksu_handle_input_handle_event" not in s:
              decl = (GUARD +
                  "extern bool ksu_input_hook __read_mostly;\n"
                  "extern int ksu_handle_input_handle_event(unsigned int *type, unsigned int *code, int *value);\n"
                  "#endif\n")
              m = re.search(r"^void input_event\(", s, re.M)
              assert m, "input_event not found"
              s = s[:m.start()] + decl + s[m.start():]
              m = re.search(r"^void input_event\([^)]*\)\s*\{\s*unsigned long flags;\n", s, re.M | re.S)
              assert m, "input_event body not found"
              call = ("\n" + GUARD +
                  "\tif (unlikely(ksu_input_hook))\n"
                  "\t\tksu_handle_input_handle_event(&type, &code, &value);\n"
                  "#endif\n")
              s = s[:m.end()] + call + s[m.end():]
              open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)

          # --- fs/exec.c (native execve) ---
          p = "fs/exec.c"
          s = open(p, encoding="utf-8", errors="surrogateescape").read()
          if "extern int ksu_handle_execve_sucompat" not in s:
              decl = (GUARD +
                  "__attribute__((hot))\n"
                  "extern int ksu_handle_execve_sucompat(int *fd, const char __user **filename_user,\n"
                  "\t\t\t       void *__never_use_argv, void *__never_use_envp,\n"
                  "\t\t\t       int *__never_use_flags);\n"
                  "#endif\n\n")
              m = re.search(r"^SYSCALL_DEFINE3\(execve,", s, re.M)
              assert m, "execve not found"
              s = s[:m.start()] + decl + s[m.start():]
              m = re.search(r"^SYSCALL_DEFINE3\(execve,[^{]*\{\n", s, re.M)
              assert m, "execve body not found"
              call = (GUARD +
                  "\tksu_handle_execve_sucompat((int *)AT_FDCWD, &filename, NULL, NULL, NULL);\n"
                  "#endif\n")
              s = s[:m.end()] + call + s[m.end():]
              open(p, "w", encoding="utf-8", errors="surrogateescape").write(s)
          PY

          # 3) verify hooks are present in all 7 files
          for f in drivers/input/input.c fs/exec.c fs/open.c fs/read_write.c fs/stat.c kernel/reboot.c kernel/sys.c; do
            grep -q "ksu_handle" "$f" || { echo "::error::hook missing in $f"; exit 1; }
          done
          [ "$(grep -c ksu_handle_execve_sucompat fs/exec.c)" -ge 3 ] \
            || { echo "::error::exec.c hooks incomplete"; exit 1; }
          echo "All hooks in place"

      - name: Configure kernel
        working-directory: kernel
        run: |
          make $MAKE_FLAGS "$DEFCONFIG"
          scripts/config --file out/.config --set-str LOCALVERSION "$LOCALVERSION"
          make $MAKE_FLAGS olddefconfig

      - name: Enable KSU options
        if: ${{ inputs.ksu }}
        working-directory: kernel
        run: |
          scripts/config --file out/.config \
            -e KSU -e KSU_MANUAL_HOOK -d KSU_KPROBES_HOOK
          make $MAKE_FLAGS olddefconfig
          echo "--- KSU options in final .config ---"
          grep "CONFIG_KSU" out/.config
          for opt in KSU KSU_MANUAL_HOOK; do
            grep -q "^CONFIG_${opt}=y" out/.config \
              || { echo "::error::CONFIG_${opt} did not stick"; exit 1; }
          done
          
      - name: Prepare libdss paths
        working-directory: kernel
        run: |
          echo "--- who mentions libdss ---"
          grep -rn "libdss" --include='Makefile*' --include='Kbuild*' --include='*.mk' . 2>/dev/null | grep -v '^./out/' | head -20 || true
          mkdir -p out/lib
          for f in lib/libdss* lib/make_libdss.py; do
            [ -e "$f" ] && ln -sfn "$PWD/$f" "out/$f"
          done
          ls -la out/lib | head

      - name: Build kernel
        working-directory: kernel
        run: |
          make $MAKE_FLAGS 2>&1 | tee ../build.log || {
            echo "=== FIRST ERRORS ==="
            grep -nE "error:|undefined reference|No such file|\*\*\* \[" ../build.log | head -30
            exit 1
          }

      - name: Package with repo AnyKernel3
        run: |
          BOOT=kernel/out/arch/arm64/boot
          echo "--- boot dir ---"; ls -lh "$BOOT"
          echo "--- dtb files ---"; find kernel/out/arch/arm64/boot/dts -name '*.dtb' | head -20 || true
          echo "--- AnyKernel3 dir (from repo) ---"; ls -la "kernel/$AK3_DIR"
          test -f "$BOOT/Image"
          cp "$BOOT/Image" "kernel/$AK3_DIR/Image"
          sed -i 's|^kernel.string=.*|kernel.string=WKP (White Kernel Project) for Galaxy A51|' "kernel/$AK3_DIR/anykernel.sh"
          cd "kernel/$AK3_DIR"
          if [ "${{ inputs.ksu }}" = "true" ]; then TAG=ksu; else TAG=clean; fi
          zip -r9 "$GITHUB_WORKSPACE/WKP-a51-$TAG-$(date +%Y%m%d).zip" . -x "*.git*" "*.md"

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: WKP-a51
          path: WKP-a51-*.zip

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
